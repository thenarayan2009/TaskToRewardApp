{% extends 'base.html' %}
{% block title %}Login - Task To Reward{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-4">
        <div class="card p-4">
            <h3 class="fw-bold mb-4 text-center">Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </div>
                <p class="text-center mt-3 mb-0 small text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none">Register</a></p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
