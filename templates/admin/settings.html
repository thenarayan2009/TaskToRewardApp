{% extends 'base.html' %}
{% block title %}System Settings - Admin Panel{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-5">
        <div class="card p-4">
            <h3 class="fw-bold mb-4 text-center">System Settings</h3>
            <form method="POST">
                <div class="mb-4">
                    <label for="min_withdrawal" class="form-label">Minimum Withdrawal Amount (₹)</label>
                    <input type="number" step="0.01" class="form-control" id="min_withdrawal" name="min_withdrawal" value="{{ min_withdrawal }}" required>
                    <div class="form-text">Users must reach this amount before requesting a withdrawal.</div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Update Settings</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
