{% extends 'base.html' %}
{% block title %}Register - Task To Reward{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-5">
        <div class="card p-4">
            <h3 class="fw-bold mb-4 text-center">Create Account</h3>
            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="mobile" class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" id="mobile" name="mobile" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Register</button>
                </div>
                <p class="text-center mt-3 mb-0 small text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none">Login</a></p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
